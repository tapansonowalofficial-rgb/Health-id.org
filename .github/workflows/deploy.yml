name: 🧠 Neural CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # PHASE 1: SECURITY & INTEGRITY
  validate-and-scan:
    name: 🛡️ Security & Integrity Scan
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Logic Synchronized
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Initialize Neural Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 🔍 Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧬 Dependency Verification
        run: npm ci

      - name: 🧪 Type Integrity Check
        run: npx tsc --noEmit

      - name: 🎨 Linting Logic
        run: npm run lint

  # PHASE 2: DEPLOYMENT
  deploy-to-production:
    name: 🚀 Deploy to Neural Production
    needs: validate-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 🛰️ Logic Synchronized
        uses: actions/checkout@v4

      - name: 🌌 Deploying to Vercel Cloud
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: ./

      - name: ✅ Deployment Verified
        run: echo "Neural Health ID deployed successfully"