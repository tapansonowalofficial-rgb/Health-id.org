/* ═══════════════════════════════════════════════════════

:root {
  --void:#00000a; --bg:#030a1a; --surface:rgba(4,14,40,.93);
  --glass:rgba(5,18,52,.80); --border:rgba(0,229,255,.13);
  --borderH:rgba(0,229,255,.5);
  --cyan:#00e5ff; --cyanL:rgba(0,229,255,.09); --cyanG:rgba(0,229,255,.35);
  --neon:#00ff9d; --neonL:rgba(0,255,157,.09);
  --plasma:#c471ff; --plasmaL:rgba(196,113,255,.11);
  --amber:#ffb700; --amberL:rgba(255,183,0,.09);
  --red:#ff2d55; --redL:rgba(255,45,85,.09);
  --gold:#ffd700; --text:#d0eeff; --muted:#3a6080;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:var(--void); }
body { font-family:'Rajdhani',sans-serif; color:var(--text); overscroll-behavior:none; -webkit-font-smoothing:antialiased; }
::-webkit-scrollbar { width:2px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
input, textarea, select { -webkit-appearance:none; appearance:none; }
input[type=date]::-webkit-calendar-picker-indicator { filter:invert(.4) sepia(1) hue-rotate(175deg) saturate(4); }
button { -webkit-appearance:none; font-family:inherit; }
a { color:inherit; text-decoration:none; }

/* ANIMATIONS */
@keyframes breathe  { 0%,100%{opacity:.45;transform:scale(1)} 50%{opacity:.88;transform:scale(1.1)} }
@keyframes pulse    { 0%,100%{opacity:.65;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }
@keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes orbitR   { from{transform:rotateZ(0deg) rotateX(70deg)} to{transform:rotateZ(360deg) rotateX(70deg)} }
@keyframes slideUp  { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }
@keyframes waveBar  { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }
@keyframes spin     { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes scanLine { 0%{top:-2px} 100%{top:100%} }
@keyframes glitch   { 0%,91%,100%{transform:none;opacity:1} 92%{transform:skewX(5deg);opacity:.8} 94%{transform:skewX(-3deg)} 96%{transform:none} }
@keyframes shake    { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-5px)} 40%,80%{transform:translateX(5px)} }
@keyframes popIn    { 0%{opacity:0;transform:scale(.85)} 100%{opacity:1;transform:scale(1)} }
@keyframes ripple   { 0%{transform:scale(.8);opacity:1} 100%{transform:scale(2.8);opacity:0} }

/* LAYOUT */

.hg-top  { position:absolute; top:-5%; left:50%; transform:translateX(-50%); width:700px; height:700px; border-radius:50%; background:radial-gradient(ellipse,rgba(0,229,255,.045) 0%,transparent 70%); animation:breathe 5s ease-in-out infinite; }
.hg-bot  { position:absolute; bottom:-25%; right:-10%; width:500px; height:500px; border-radius:50%; background:radial-gradient(ellipse,rgba(196,113,255,.055) 0%,transparent 70%); animation:breathe 7s ease-in-out infinite reverse; }

#shell { position:relative; z-index:10; height:100vh; display:flex; flex-direction:column; max-width:460px; margin:0 auto; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 20px; border-radius:12px; border:none; font-family:'Orbitron',monospace; font-weight:700; font-size:11px; letter-spacing:.09em; cursor:pointer; transition:all .2s; white-space:nowrap; position:relative; overflow:hidden; }

.field-input.has-icon { padding-left:40px; }

.sec-head { display:flex; align-items:center; gap:9px; margin-bottom:13px; }

/* ORB */

.orb-core { position:absolute; border-radius:50%; animation:pulse 3s ease-in-out infinite; }

.toggle.on .toggle-knob { left:23px; }

/* FILTER ROW */
.filter-row  { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; margin-bottom:13px; scrollbar-width:none; }

.filter-btn.active { border-color:var(--cyan); background:var(--cyanL); color:var(--cyan); }

.modal-overlay { position:fixed; inset:0; background:rgba(0,0,12,.87); z-index:500; display:flex; flex-direction:column; justify-content:flex-end; animation:fadeIn .25s ease; }

/* DOC AVATAR */

const CONFIG = {
  APP_NAME:    'Neural Health ID',

const $    = id  => document.getElementById(id);

const sleep= ms  => new Promise(r => setTimeout(r, ms));

let _toastTimer;
function toast(msg, type='ok') {
  const el = $('toast'); if (!el) return;
  const colors = { ok:'var(--neon)', err:'var(--red)', info:'var(--amber)', warn:'var(--plasma)' };
  const icons  = { ok:'✓ ',         err:'⚠ ',         info:'◎ ',           warn:'◈ ' };
  el.textContent = (icons[type] || '✓ ') + msg;
  el.style.borderColor = colors[type] || colors.ok;
  el.style.color       = colors[type] || colors.ok;
  el.classList.add('visible');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('visible'), 3400);
}

// CRYPTO ENGINE
// ──────────────────────────────────────────────────────────────────
const CRYPTO = {
  async hash(str) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    } catch {
      // Fallback for environments without SubtleCrypto
      let h = 5381;
      for (let i=0; i<str.length; i++) h = ((h<<5)+h) ^ str.charCodeAt(i);
      return (h >>> 0).toString(16).repeat(4);
    }
  },
  encrypt(data)  { try { return btoa(encodeURIComponent(JSON.stringify(data))); }  catch { return null; } },
  decrypt(str)   { try { return JSON.parse(decodeURIComponent(atob(str))); }        catch { return null; } },
  genUID()  { return 'U' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,7).toUpperCase(); },
  genHID()  { const a=Date.now().toString(36).toUpperCase().slice(-5), b=Math.random().toString(36).slice(2,7).toUpperCase(); return `HID-${a}-${b}`; },
  genOTP()  { return Math.floor(100000 + Math.random() * 900000).toString(); },
  genToken(){ try { return Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b=>b.toString(16).padStart(2,'0')).join(''); } catch { return Math.random().toString(36).repeat(5).slice(0,64); } },
};

  async createUser(payload) {

      if (u?.phone === payload.phone) return { error: 'Mobile number already registered. Please login.' };

    };
    this._users[uid] = CRYPTO.encrypt(user);

    return { data: user, error: null };
  },

  async findByPhone(phone) {
    this._load();
    for (const uid in this._users) {
      const u = CRYPTO.decrypt(this._users[uid]);
      if (u?.phone === phone) return { data: u, error: null };
    }
    return { data: null, error: 'User not found' };
  },

  async getUser(uid) {
    this._load();
    const raw = this._users[uid];
    return raw ? { data: CRYPTO.decrypt(raw), error: null } : { data: null, error: 'User not found' };
  },

  async updateUser(uid, patch) {
    this._load();
    const raw = this._users[uid];
    if (!raw) return { error: 'User not found' };
    const updated = { ...CRYPTO.decrypt(raw), ...patch, updatedAt: new Date().toISOString() };
    this._users[uid] = CRYPTO.encrypt(updated);
    this._save();
    return { data: updated, error: null };
  },

  async verifyPassword(uid, password) {
    const { data: u } = await this.getUser(uid);
    if (!u) return false;
    if (u.locked) return false;
    const hash = await CRYPTO.hash(password + CONFIG.SALT);
    if (u.passwordHash === hash) {
      await this.updateUser(uid, { loginAttempts: 0, lastLogin: new Date().toISOString() });
      return true;
    }
    const att = (u.loginAttempts || 0) + 1;
    await this.updateUser(uid, { loginAttempts: att, locked: att >= CONFIG.MAX_ATTEMPTS });
    return false;
  },

  // ── OTP ────────────────────────────────────────────────────────
  sendOTP(phone) {
    const otp = CRYPTO.genOTP();
    this._otps[phone] = { otp, exp: Date.now() + CONFIG.OTP_TTL, tries: 0 };
    // ── PRODUCTION: uncomment and configure SMS provider ──
    // fetch('https://api.msg91.com/api/v5/otp', {

    //   body: JSON.stringify({ mobile: '91' + phone, otp, template_id: 'YOUR_TEMPLATE_ID', otp_expiry: 5 })
    // });
    if (CONFIG.IS_DEV) console.log(`📱 [DEV] OTP for ${phone}: ${otp}`);
    return otp;
  },

  verifyOTP(phone, input) {
    const rec = this._otps[phone];
    if (!rec)               return { ok: false, message: 'No OTP sent for this number' };
    if (Date.now() > rec.exp) return { ok: false, message: 'OTP expired. Please request a new one.' };
    if (rec.tries >= 3)    return { ok: false, message: 'Too many attempts. Request a new OTP.' };
    rec.tries++;
    if (rec.otp === input) { delete this._otps[phone]; return { ok: true }; }
    return { ok: false, message: `Incorrect OTP. ${3 - rec.tries} attempt${3-rec.tries===1?'':'s'} remaining.` };
  },

const BIO = {
  available: false,
  init() { this.available = !!(window.PublicKeyCredential && navigator.credentials?.create); },
  async register(userId) {
    if (!this.available) return { error: 'Not supported on this device' };
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      await navigator.credentials.create({ publicKey: {
        challenge,
        rp: { name: CONFIG.APP_NAME, id: location.hostname },
        user: { id: new TextEncoder().encode(userId), name: userId, displayName: 'Health ID User' },
        pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
        timeout: 30000,
        authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
      }});
      return { ok: true };
    } catch (e) { return { error: e.message }; }
  },
  async authenticate() {
    if (!this.available) return { error: 'Not supported on this device' };
    try {
      const challenge = crypto.getRandomValues(new Uint8Array(32));
      await navigator.credentials.get({ publicKey: { challenge, timeout:30000, userVerification:'required' } });
      return { ok: true };
    } catch (e) { return { error: e.message }; }
  },
};

// NEURAL CANVAS ANIMATION
// ──────────────────────────────────────────────────────────────────
function initCanvas() {
  const canvas = $('bg-canvas'); if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, nodes = [], raf;
  const resize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };
  resize(); window.addEventListener('resize', resize);
  for (let i = 0; i < 52; i++) nodes.push({
    x: Math.random() * 1300, y: Math.random() * 900,
    vx: (Math.random() - .5) * .2, vy: (Math.random() - .5) * .2,
    r: Math.random() * 1.3 + .4, phase: Math.random() * Math.PI * 2,
    type: Math.random() > .65 ? 'p' : 'c',
  });
  (function draw() {
    ctx.clearRect(0, 0, W, H);
    nodes.forEach(n => { n.x += n.vx; n.y += n.vy; n.phase += .015; if(n.x<0||n.x>W) n.vx*=-1; if(n.y<0||n.y>H) n.vy*=-1; });
    nodes.forEach((a, i) => nodes.slice(i+1).forEach(b => {
      const d = Math.hypot(a.x-b.x, a.y-b.y); if (d > 128) return;
      ctx.strokeStyle = `rgba(0,229,255,${(1-d/128)*.22})`; ctx.lineWidth = .45;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }));
    nodes.forEach(n => {
      const g = Math.sin(n.phase) * .5 + .5;
      const [r, gv, b] = n.type === 'p' ? [196,113,255] : [0,229,255];
      const gr = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r*5);
      gr.addColorStop(0, `rgba(${r},${gv},${b},${.7*g})`);
      gr.addColorStop(1, `rgba(${r},${gv},${b},0)`);
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(n.x, n.y, n.r*5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(${r},${gv},${b},1)`; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
    });
    raf = requestAnimationFrame(draw);
  })();
}

function sparklineHTML(data, color, w = 108, h = 42) {
  if (!data || data.length < 2) return '';
  const max = Math.max(...data), min = Math.min(...data), range = max - min || 1;
  const pts = data.map((v, i) => `${(i/(data.length-1))*w},${h - ((v-min)/range)*h*.82 - 3}`).join(' ');
  const lx = w, ly = h - ((data[data.length-1]-min)/range)*h*.82 - 3;
  const gid = 'grad_' + color.replace(/[^a-z0-9]/gi,'');
  return `<svg width="${w}" height="${h}" style="overflow:visible;display:block;">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polyline points="0,${h} ${pts} ${w},${h}" fill="url(#${gid})" stroke="none"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="3" fill="${color}" style="filter:drop-shadow(0 0 4px ${color});"/>
  </svg>`;
}

// ── AUTH BINDING ───────────────────────────────────────────────────
function bindAuth() {
  const wrap = $('auth-wrap'); if (!wrap) return;
  wrap.innerHTML = renderAuthView();

  // ── LOGIN ──────────────────────────────────────────────────────
  if (APP.authView === 'login') {
    onClick('btn-login', async () => {
      const phone = fVal('l-phone'), pass = fVal('l-pass');
      if (!phone || !pass) { showLoginError('Mobile number and password are required.'); return; }
      setLoading('btn-login', true);
      await sleep(750);
      if (phone === '9999999999' && pass === 'Demo@1234') {
        DB.createSession('DEMO_UID'); APP.uid = 'DEMO_UID';
        const { data: u } = await DB.getUser('DEMO_UID');
        APP.user = u; toast('Welcome back, ' + u.name); loadApp(); return;
      }
      const { data: u } = await DB.findByPhone(phone);
      if (!u) { showLoginError('No account found with this number. Please register.'); setLoading('btn-login', false); return; }
      if (u.locked) { showLoginError(`Account locked after ${CONFIG.MAX_ATTEMPTS} failed attempts. Use Account Recovery to reset.`); setLoading('btn-login', false); return; }
      const ok = await DB.verifyPassword(u.uid, pass);
      if (!ok) {
        const { data: u2 } = await DB.getUser(u.uid);
        const left = CONFIG.MAX_ATTEMPTS - (u2?.loginAttempts || 0);
        showLoginError(`Incorrect password. ${left} attempt${left===1?'':'s'} remaining before account locks.`);
        setLoading('btn-login', false); return;
      }
      DB.createSession(u.uid); APP.uid = u.uid; APP.user = u;
      toast('Secure login successful · Welcome, ' + u.name); loadApp();
      setLoading('btn-login', false);
    });

    onClick('l-show-pass', () => { const i = $('l-pass'); if (i) i.type = i.type === 'password' ? 'text' : 'password'; });
    onClick('btn-goto-forgot', () => { APP.authView = 'forgot'; bindAuth(); });
    onClick('btn-goto-signup', () => { APP.authView = 'signup'; APP.regStep = 0; APP.regForm = {}; APP.otpVerified = { phone:false, aadhaar:false }; bindAuth(); });

    onClick('btn-bio-login', async () => {
      if (!BIO.available) { toast('Biometric not supported on this device', 'warn'); return; }
      setLoading('btn-bio-login', true);
      const result = await BIO.authenticate();
      if (result.ok) {
        DB.createSession('DEMO_UID'); APP.uid = 'DEMO_UID';
        const { data: u } = await DB.getUser('DEMO_UID');
        APP.user = u; toast('Biometric verified · Welcome'); loadApp();
      } else toast('Biometric failed: ' + result.error, 'err');
      setLoading('btn-bio-login', false);
    });

    onClick('btn-otp-toggle', () => {
      const section = $('otp-login-section'); if (!section) return;
      const isOpen = section.style.display !== 'none';
      section.style.display = isOpen ? 'none' : 'block';
      if (!isOpen) {
        const phone = fVal('l-phone') || '9999999999';
        const otp   = DB.sendOTP(phone);
        const hint  = $('otp-login-hint');
        if (hint) { hint.style.display='block'; hint.innerHTML=`OTP sent to ${phone}: <strong>${otp}</strong>${CONFIG.IS_DEV?' <span style="opacity:.5">(dev mode)</span>':''}`; }
        toast('OTP sent to ' + phone);
      }
    });

    onClick('btn-verify-otp-login', async () => {
      const phone = fVal('l-phone') || '9999999999', otp = fVal('l-otp');
      const result = DB.verifyOTP(phone, otp);
      if (!result.ok) { toast(result.message, 'err'); return; }
      let uid = 'DEMO_UID';
      if (phone !== '9999999999') {
        const { data: u } = await DB.findByPhone(phone);
        if (u) uid = u.uid;
      }
      DB.createSession(uid); APP.uid = uid;
      const { data: u } = await DB.getUser(uid);
      APP.user = u; toast('OTP verified · Welcome'); loadApp();
    });
  }

  // ── SIGNUP ─────────────────────────────────────────────────────
  if (APP.authView === 'signup') {
    onClick('btn-reg-back', () => { APP.regStep > 0 ? APP.regStep-- : (APP.authView = 'login'); bindAuth(); });

    if (APP.regStep === 0) {
      onClick('btn-reg-step0', () => {
        const name=fVal('r-name'), phone=fVal('r-phone'), email=fVal('r-email'), dob=fVal('r-dob');
        let valid = true;
        if (!name || name.length < 2)    { fErr('r-name','Full name required (min 2 characters)'); valid=false; } else fErr('r-name','');
        if (!/^\d{10}$/.test(phone))     { fErr('r-phone','Enter a valid 10-digit mobile number'); valid=false; } else fErr('r-phone','');
        if (!/\S+@\S+\.\S+/.test(email)) { fErr('r-email','Enter a valid email address'); valid=false; } else fErr('r-email','');
        if (!dob) { fErr('r-dob','Date of birth is required'); valid=false; }
        else { const age = new Date().getFullYear() - new Date(dob).getFullYear(); if(age<5||age>120){fErr('r-dob','Invalid date of birth');valid=false;} else fErr('r-dob',''); }
        if (!valid) return;
        APP.regForm = { ...APP.regForm, name, phone, email, dob, gender: fVal('r-gender') };
        APP.regStep = 1; bindAuth();
      });
    }

    if (APP.regStep === 1) {
      onClick('btn-send-aadhaar-otp', () => {
        const aadhaar = fVal('r-aadhaar');
        if (!/^\d{12}$/.test(aadhaar)) { fErr('r-aadhaar','Enter a valid 12-digit Aadhaar number'); return; }
        fErr('r-aadhaar','');
        APP.regForm.aadhaar = aadhaar;
        const otp  = DB.sendOTP(APP.regForm.phone);
        const area = $('aadhaar-verify-area'), hint = $('aadhaar-otp-hint');
        if (area) area.style.display = 'block';
        if (hint) { hint.style.display='block'; hint.innerHTML=`OTP sent to ${APP.regForm.phone}: <strong>${otp}</strong>${CONFIG.IS_DEV?' <span style="opacity:.5">(dev)</span>':''}`; }
        toast('OTP sent to Aadhaar-linked mobile');
      });
      onClick('btn-verify-aadhaar', () => {
        const otp = fVal('r-aadhaar-otp'), result = DB.verifyOTP(APP.regForm.phone, otp);
        if (!result.ok) { fErr('r-aadhaar-otp', result.message); return; }
        fErr('r-aadhaar-otp','');
        APP.otpVerified.aadhaar = true; toast('Aadhaar verified ✓');
        APP.regStep = 1; bindAuth();
      });
      onClick('btn-reg-step1', () => {
        if (!APP.otpVerified.aadhaar) { toast('Please verify your Aadhaar first', 'warn'); return; }
        APP.regStep = 2; bindAuth();
      });
    }

    if (APP.regStep === 2) {
      onInput('r-password', updatePasswordStrength);
      onClick('btn-reg-step2', () => {
        const pw=fVal('r-password'), confirm=fVal('r-confirm'), pin=fVal('r-pin');
        let valid = true;
        if (pw.length < 8)               { fErr('r-password','Minimum 8 characters required'); valid=false; }
        else if (!/[A-Z]/.test(pw))      { fErr('r-password','Need at least one uppercase letter'); valid=false; }
        else if (!/[0-9]/.test(pw))      { fErr('r-password','Need at least one number'); valid=false; }
        else fErr('r-password','');
        if (pw !== confirm)              { fErr('r-confirm','Passwords do not match'); valid=false; } else fErr('r-confirm','');
        if (!/^\d{6}$/.test(pin))        { fErr('r-pin','PIN must be exactly 6 digits'); valid=false; } else fErr('r-pin','');
        if (!valid) return;
        APP.regForm = { ...APP.regForm, password: pw, pin };
        APP.regStep = 3; bindAuth();
      });
    }

    if (APP.regStep === 3) {
      onClick('btn-register-bio', async () => {
        if (!BIO.available) { toast('Biometric not available — enable later in Security settings', 'info'); return; }
        const result = await BIO.register(APP.regForm.phone || 'user');
        const el = $('bio-register-result');
        if (result.ok) {
          if (el) { el.style.display='block'; el.style.cssText+='background:var(--neonL);color:var(--neon);border:1px solid rgba(0,255,157,.3);'; el.textContent='✅ Biometric registered successfully!'; }
          APP.regForm.biometric = true;
        } else {
          if (el) { el.style.display='block'; el.style.cssText+='background:var(--amberL);color:var(--amber);border:1px solid rgba(255,183,0,.3);'; el.textContent='⚠ ' + result.error + '. You can enable biometric later in Security Settings.'; }
        }
      });
      onClick('btn-skip-bio', () => completeRegistration());
    }
  }

  // ── FORGOT ─────────────────────────────────────────────────────
  if (APP.authView === 'forgot') {
    onClick('btn-forgot-back', () => { APP.authView = 'login'; bindAuth(); });
    $$('.forgot-method').forEach(b => b.addEventListener('click', () => {
      APP.forgotMethod = b.dataset.method;
      $$('.forgot-method').forEach(x => { x.style.background='transparent'; x.style.opacity='.7'; });
      b.style.background = 'var(--amberL)'; b.style.opacity = '1';
    }));
    onClick('btn-send-forgot-otp', () => {
      const val = fVal('f-value'); if (!val) { fErr('f-value','Required'); return; } fErr('f-value','');
      const otp   = DB.sendOTP('9999999999'); // Production: derive phone from value
      const hint  = $('forgot-otp-hint'), section = $('forgot-otp-section'), sendWrap = $('forgot-send-wrap');
      if (hint)     { hint.style.display='block'; hint.innerHTML=`Recovery OTP: <strong>${otp}</strong>${CONFIG.IS_DEV?' <span style="opacity:.5">(dev)</span>':''}`; }
      if (section)  section.style.display = 'block';
      if (sendWrap) sendWrap.style.display = 'none';
      toast('Recovery OTP sent');
    });
    onClick('btn-verify-forgot-otp', () => {
      const otp = fVal('f-otp'), result = DB.verifyOTP('9999999999', otp);
      const errEl = $('forgot-error');
      if (!result.ok) { if(errEl){errEl.style.display='block';errEl.textContent='⚠ '+result.message;} return; }
      if (errEl) errEl.style.display = 'none';
      const otpSec=$('forgot-otp-section'), npSec=$('forgot-newpass-section');
      if (otpSec) otpSec.style.display='none';
      if (npSec)  npSec.style.display='block';
      toast('OTP verified · Set new password');
    });
    onClick('btn-save-new-pass', async () => {
      const np=fVal('f-new-pass'), nc=fVal('f-confirm-pass'); let valid=true;
      if (np.length<8) { fErr('f-new-pass','Minimum 8 characters'); valid=false; } else fErr('f-new-pass','');
      if (np!==nc)     { fErr('f-confirm-pass','Passwords do not match'); valid=false; } else fErr('f-confirm-pass','');
      if (!valid) return;
      setLoading('btn-save-new-pass', true); await sleep(800);
      const ph = fVal('f-value');
      const { data: u } = ph ? await DB.findByPhone(ph) : { data: null };
      const uid = u?.uid || 'DEMO_UID';
      await DB.updateUser(uid, { passwordHash: await CRYPTO.hash(np + CONFIG.SALT) });
      const flow=$('forgot-flow'), success=$('forgot-success');
      if (flow) flow.style.display='none'; if (success) success.style.display='block';
      toast('Password reset successfully · Please login');
      setLoading('btn-save-new-pass', false);
    });
    onClick('btn-back-to-login', () => { APP.authView='login'; bindAuth(); });
  }
}

function showLoginError(msg) {
  const el = $('login-error'); if (!el) return;
  el.textContent = '⚠ ' + msg; el.style.display = 'block';
  el.style.animation = 'none'; setTimeout(() => el.style.animation='shake .4s ease', 10);
}

function updatePasswordStrength() {
  const pw = fVal('r-password'), bar = $('pw-strength-bar');
  if (!pw) { if (bar) bar.style.display='none'; return; }
  if (bar) bar.style.display='block';
  let score = 0;
  if (pw.length >= 8)           score++;
  if (/[A-Z]/.test(pw))         score++;
  if (/[0-9]/.test(pw))         score++;
  if (/[^a-zA-Z0-9]/.test(pw)) score++;
  const colors = [null,'var(--red)','var(--amber)','var(--amber)','var(--neon)'];
  const labels = ['','WEAK','FAIR','STRONG','FORTRESS'];
  [1,2,3,4].forEach(i => { const b = $(`pb${i}`); if (b) b.style.background = i<=score ? colors[score] : 'var(--border)'; });
  const lbl = $('pw-strength-label'); if (lbl) { lbl.textContent = labels[score]; lbl.style.color = colors[score]; }
}

async function completeRegistration() {
  const btn = $('btn-skip-bio');
  if (btn) { btn.disabled=true; btn.innerHTML='<span class="spin">⟳</span> CREATING ACCOUNT...'; }
  await sleep(1400);
  const { data: user, error } = await DB.createUser(APP.regForm);
  if (error) { toast(error, 'err'); if(btn){btn.disabled=false;btn.innerHTML='SKIP · COMPLETE REGISTRATION';} return; }
  await DB.updateUser(user.uid, {
    verified: { phone: APP.otpVerified.phone, email:false, aadhaar: APP.otpVerified.aadhaar },
    security: { ...user.security, biometric: !!APP.regForm.biometric },
    pin: APP.regForm.pin || '',
  });
  DB.createSession(user.uid); APP.uid = user.uid;
  const { data: freshUser } = await DB.getUser(user.uid);
  APP.user = freshUser;
  toast('Account created! Welcome to Neural Health ID 🎉');
  showOnboarding();
}

// TAB BINDING
// ──────────────────────────────────────────────────────────────────
function bindCurrentTab() {
  const t = APP.tab;

  if (t === 'records') {
    $$('#records-filter .filter-btn').forEach(b => b.addEventListener('click', () => {
      $$('#records-filter .filter-btn').forEach(x => x.classList.remove('active')); b.classList.add('active');
      const filter = b.dataset.filter;
      $$('.rec-item').forEach(item => { item.style.display = (filter === 'ALL' || item.dataset.type === filter) ? 'block' : 'none'; });
    }));
  }

  if (t === 'ai') {
    $$('.ai-suggestion').forEach(b => b.addEventListener('click', () => { const i = $('ai-input'); if (i) { i.value = decodeURIComponent(b.dataset.query); i.focus(); } }));
    onClick('btn-ai-send', handleAISend);
    setTimeout(() => { const cb = $('chatbox'); if (cb) cb.scrollTop = cb.scrollHeight; }, 50);
  }

  if (t === 'doctors') {
    onInput('doc-search', () => {
      const q = ($('doc-search')?.value || '').toLowerCase();
      $$('.doc-item').forEach(item => { item.style.display = (!q || item.dataset.name.includes(q) || item.dataset.spec.includes(q)) ? 'block' : 'none'; });
    });
    $$('.doc-book-btn').forEach(b => b.addEventListener('click', () => {
      const idx = parseInt(b.dataset.idx);
      if (APP.bookedDocs.has(idx)) { APP.bookedDocs.delete(idx); toast('Appointment cancelled'); }
      else { APP.bookedDocs.add(idx); toast('Appointment booked with ' + DOCTORS_LIST[idx].name + ' · ' + DOCTORS_LIST[idx].avail); }
      renderTab();
    }));
  }

  if (t === 'schedule') {
    onClick('btn-new-appt', showBookingModal);
    $$('[data-action]').forEach(b => b.addEventListener('click', () => {
      const id = parseInt(b.dataset.apptId), action = b.dataset.action;
      if (action === 'details') showApptDetailsModal(id);
      if (action === 'reschedule') showRescheduleModal(id);
    }));
  }

  if (t === 'emergency') {
    setTimeout(() => renderQR('qr-container', `https://${CONFIG.DOMAIN}/emergency?id=${APP.user?.hid||'DEMO'}&blood=${APP.user?.blood||''}&name=${encodeURIComponent(APP.user?.name||'')}&t=${Date.now()}`, 165), 100);
    onClick('sos-btn', () => {
      APP.sosActive = !APP.sosActive;
      toast(APP.sosActive ? 'Emergency ID transmitted to all nearby hospitals 🏥' : 'Emergency ID deactivated');
      renderTab();
      setTimeout(() => renderQR('qr-container', `https://${CONFIG.DOMAIN}/emergency?id=${APP.user?.hid||'DEMO'}&t=${Date.now()}`, 165), 100);
    });
    onClick('btn-logout-emer', doLogout);
  }

  if (t === 'security') {
    $$('.toggle').forEach(tog => tog.addEventListener('click', async () => {
      const k = tog.dataset.key, u = APP.user || {};
      const newVal = !u.security?.[k];
      tog.classList.toggle('on', newVal);
      tog.setAttribute('aria-checked', newVal);
      await DB.updateUser(APP.uid, { security: { ...(u.security||{}), [k]: newVal } });
      const { data: updated } = await DB.getUser(APP.uid); APP.user = updated;
      const names = { twoFA:'Two-Factor Auth', biometric:'Biometric', notifications:'Notifications', autoLock:'Auto-Lock' };
      toast(`${names[k]||k} ${newVal ? 'enabled' : 'disabled'}`);
    }));
    onClick('btn-export-data', exportHealthData);
    onClick('btn-change-pass', () => { APP.authView='forgot'; APP.forgotStage='input'; showAuth(); toast('Use account recovery to change your password','info'); });
    onClick('btn-logout-sec', doLogout);
  }

  if (t === 'profile') {
    onClick('btn-photo',       () => toast('Photo upload available in the native mobile app','info'));
    onClick('btn-edit-basic',     () => showEditModal('basic'));
    onClick('btn-edit-health',    () => showEditModal('health'));
    onClick('btn-edit-allergy',   () => showEditModal('allergy'));
    onClick('btn-edit-meds',      () => showEditModal('meds'));
    onClick('btn-edit-emergency', () => showEditModal('emergency'));
    onClick('btn-edit-insurance', () => showEditModal('insurance'));
    onClick('btn-edit-vitals',    () => showEditModal('vitals'));
    onClick('btn-print-card',     printHealthCard);
    onClick('btn-share-report',   shareHealthReport);
  }
}

// ──────────────────────────────────────────────────────────────────
// AI CHAT
// ──────────────────────────────────────────────────────────────────
async function handleAISend() {
  const input = $('ai-input'); if (!input) return;
  const text = input.value.trim(); if (!text || APP.aiLoading) return;
  input.value = ''; APP.aiLoading = true;
  const ts = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  APP.chatHistory.push({ role:'user', text, ts });
  renderTab();
  setTimeout(() => { const cb = $('chatbox'); if (cb) cb.scrollTop = cb.scrollHeight; }, 30);
  try {
    const reply = await AI.chat(APP.chatHistory.map(m => ({ role:m.role, content:m.text })), APP.user);
    APP.chatHistory.push({ role:'assistant', text:reply, ts:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) });
  } catch (e) {
    APP.chatHistory.push({ role:'assistant', text:'Neural link temporarily disrupted. Please check your connection and try again.', ts:'ERR' });
  }
  APP.aiLoading = false;
  renderTab();
  setTimeout(() => { const cb = $('chatbox'); if (cb) cb.scrollTop = cb.scrollHeight; }, 50);
}

// MODAL SYSTEM
// ──────────────────────────────────────────────────────────────────
function openModal(contentHTML) {
  closeModal();
  const overlay = mk('div','modal-overlay');
  const sheet   = mk('div','modal-sheet');
  sheet.innerHTML = contentHTML;
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
  APP.modal = overlay;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  const closeBtn = sheet.querySelector('#btn-modal-close');
  if (closeBtn) closeBtn.addEventListener('click', closeModal);
}
function closeModal() { if (APP.modal) { APP.modal.remove(); APP.modal = null; } }

    <button class="btn btn-primary btn-block" id="btn-confirm-booking">CONFIRM BOOKING</button>
  `);
  onClick('btn-confirm-booking', async () => {
    const doc=fVal('ab-doc'), date=fVal('ab-date'), time=fVal('ab-time');

    if (!time) { fErr('ab-time','Time required'); valid=false; }       else fErr('ab-time','');
    if (!valid) return;
    setLoading('btn-confirm-booking', true);
    await sleep(600);
    const newAppt = { id:Date.now(), doc, spec:fVal('ab-spec'), date:new Date(date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}), time, type:fVal('ab-type')||'Consultation', loc:fVal('ab-loc'), status:'PENDING' };

    const { data: u } = await DB.getUser(APP.uid); APP.user = u;
    closeModal(); toast('Appointment booked with ' + doc + ' ✓'); APP.tab = 'schedule'; renderTab();
  });
}

  openModal(`
    <div class="modal-header"><span class="modal-title">📋 APPOINTMENT DETAILS</span><button class="modal-close" id="btn-modal-close">✕</button></div>
    ${cardHTML(`
      <div class="col g8">
        ${[['Doctor',a.doc],['Specialty',a.spec],['Date',a.date],['Time',a.time],['Type',a.type],['Location',a.loc||'—'],['Status',a.status]].map(([l,v])=>`<div class="row jb"><span class="fm mu" style="font-size:9px;">${l}</span><span class="fr tx" style="font-size:13px;font-weight:700;">${v}</span></div>`).join('')}
      </div>

    <button class="btn btn-outline btn-block" id="btn-cancel-appt" style="--ac:var(--red);">✕ CANCEL APPOINTMENT</button>
  `);
  onClick('btn-add-to-cal', () => {
    const start = new Date(`${a.date} ${a.time}`);
    const end   = new Date(start.getTime() + 3600000);
    const ics   = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${a.type} - ${a.doc}\nLOCATION:${a.loc||''}\nDTSTART:${start.toISOString().replace(/[-:]/g,'').slice(0,15)}Z\nDTEND:${end.toISOString().replace(/[-:]/g,'').slice(0,15)}Z\nDESCRIPTION:Appointment at Neural Health ID\nEND:VEVENT\nEND:VCALENDAR`;
    const blob  = new Blob([ics], { type:'text/calendar' });
    const link  = document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=`appointment-${a.doc.replace(/\s+/g,'-')}.ics`; link.click();
    toast('Calendar file downloaded · Import to your calendar app');
  });
  onClick('btn-cancel-appt', async () => {
    const appts = (APP.user?.appointments||[]).map(x => x.id===id ? {...x,status:'DONE'} : x);

      <button class="btn btn-primary btn-block" id="btn-em-save">SAVE INSURANCE</button>`,
    vitals: `<div class="modal-header"><span class="modal-title">📡 UPDATE VITALS</span><button class="modal-close" id="btn-modal-close">✕</button></div>
      ${fieldHTML('HEART RATE (bpm)','vm-hr','number','e.g. 72','❤️')}${fieldHTML('BLOOD PRESSURE (mmHg)','vm-bp','text','e.g. 120/80','🩸')}${fieldHTML('SPO₂ (%)','vm-spo2','number','e.g. 98','💨')}${fieldHTML('BLOOD SUGAR (mg/dL)','vm-sugar','number','e.g. 95','⚡')}${fieldHTML('TEMPERATURE (°F)','vm-temp','number','e.g. 98.6','🌡️')}
      <div style="padding:10px 13px;border-radius:10px;background:var(--amberL);border:1px solid rgba(255,183,0,.28);margin-bottom:13px;"><div class="fm am" style="font-size:9px;line-height:1.65;">⚠ Enter readings from certified medical devices only. Use calibrated glucometer, pulse oximeter, and sphygmomanometer.</div></div>
      <button class="btn btn-primary btn-block" id="btn-em-save">SAVE VITALS</button>`,
  };

  openModal(templates[section] || templates.basic);

  // Pre-fill values
  const prefill = {
    basic:     () => { fSet('em-name',u.name||''); fSet('em-email',u.email||''); fSet('em-city',u.city||''); },
    health:    () => { APP._selBlood=u.blood||''; fSet('em-height',u.height||''); fSet('em-weight',u.weight||''); fSet('em-gender',u.gender||''); fSet('em-dob',u.dob||''); },
    allergy:   () => { fSet('em-allergies',(u.allergies||[]).join(', ')); fSet('em-conditions',(u.conditions||[]).join(', ')); },
    emergency: () => { fSet('em-ec-name',u.emergency?.name||''); fSet('em-ec-rel',u.emergency?.relation||''); fSet('em-ec-phone',u.emergency?.phone||''); },
    insurance: () => { fSet('em-ins-prov',u.insurance?.provider||''); fSet('em-ins-pol',u.insurance?.policy||''); fSet('em-ins-grp',u.insurance?.group||''); fSet('em-ins-exp',u.insurance?.expiry||''); },
    vitals:    () => { const v=u.vitals||{}; fSet('vm-hr',v.hr||''); fSet('vm-bp',v.bp||''); fSet('vm-spo2',v.spo2||''); fSet('vm-sugar',v.sugar||''); fSet('vm-temp',v.temp||''); },
  };
  if (prefill[section]) prefill[section]();

  // Blood type selector
  if (section === 'health') {
    $$('.blood-opt').forEach(b => b.addEventListener('click', () => {
      $$('.blood-opt').forEach(x => x.style.background='transparent');
      b.style.background = 'rgba(255,45,85,.25)'; APP._selBlood = b.dataset.blood;
    }));
  }

  // Medication remove
  if (section === 'meds') {
    $$('.med-remove').forEach(b => b.addEventListener('click', async () => {
      const meds = (u.medications||[]).filter((_,i) => i !== parseInt(b.dataset.idx));
      await DB.updateUser(APP.uid, { medications:meds });
      const { data: up } = await DB.getUser(APP.uid); APP.user = up;
      closeModal(); showEditModal('meds');
    }));
    onClick('btn-med-add', async () => {
      const name = fVal('m-name'); if (!name) { toast('Medication name required','warn'); return; }
      const meds = [...(u.medications||[]), { id:Date.now(), name, freq:fVal('m-freq')||'As directed', since:fVal('m-since'), doc:fVal('m-doc') }];
      await DB.updateUser(APP.uid, { medications:meds });
      const { data: up } = await DB.getUser(APP.uid); APP.user = up;
      closeModal(); toast('Medication added'); renderTab();
    });
    return;
  }

  // General save
  onClick('btn-em-save', async () => {
    setLoading('btn-em-save', true); await sleep(500);
    if (saves[section]) await saves[section]();
    const { data: up } = await DB.getUser(APP.uid); APP.user = up;
    closeModal(); toast('Saved successfully ✓'); renderTab();
    setLoading('btn-em-save', false);
  });
}

function exportHealthData() {
  const data = JSON.stringify(APP.user, null, 2);
  const blob = new Blob([data], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `neural-health-id-${APP.user?.hid||'export'}-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('Health data exported · Keep this file secure');
}

async function shareHealthReport() {
  const u = APP.user || {};
  const text = `🧠 NEURAL HEALTH ID — ${u.name||'User'}
Health ID: ${u.hid||'—'}
Blood: ${u.blood||'—'} · Height: ${u.height||'—'} · Weight: ${u.weight||'—'}
Conditions: ${(u.conditions||[]).join(', ')||'None'}
Allergies: ${(u.allergies||[]).join(', ')||'None'}
Vitals: BP ${u.vitals?.bp||'—'} · HR ${u.vitals?.hr||'—'}bpm · SpO₂ ${u.vitals?.spo2||'—'}%
Emergency Contact: ${u.emergency?.name||'—'} (${u.emergency?.phone||'—'})
Generated by ${CONFIG.DOMAIN} · ${new Date().toLocaleDateString('en-IN')}`;

  if (navigator.share) {
    try { await navigator.share({ title:'My Neural Health ID', text, url:'https://'+CONFIG.DOMAIN }); toast('Health report shared ✓'); }
    catch { copyText(text); }
  } else copyText(text);
}

function copyText(text) {
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast('Health report copied to clipboard ✓'));
  else { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Health report copied ✓'); }
}

// ──────────────────────────────────────────────────────────────────
// PWA SUPPORT
// ──────────────────────────────────────────────────────────────────
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); _pwaPrompt = e;
  const banner = $('pwa-banner');
  if (banner && !localStorage.getItem('nhid_pwa_dismissed')) banner.style.display = 'block';
});
onClick('pwa-install', async () => {
  if (!_pwaPrompt) return;
  _pwaPrompt.prompt();
  const { outcome } = await _pwaPrompt.userChoice;
  if (outcome === 'accepted') { $('pwa-banner').style.display='none'; toast('Installing Neural Health ID ✓'); }
});
onClick('pwa-dismiss', () => { $('pwa-banner').style.display='none'; localStorage.setItem('nhid_pwa_dismissed','1'); });

// Service Worker
if ('serviceWorker' in navigator) {
  const SW = `
const CACHE_NAME='nhid-v4';
const CACHED_ASSETS=['/'];
self.addEventListener('install',e=>{ e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(CACHED_ASSETS))); self.skipWaiting(); });
self.addEventListener('activate',e=>{ e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE_NAME).map(k=>caches.delete(k))))); self.clients.claim(); });
self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET') return;
  if(e.request.url.includes('api.anthropic.com')||e.request.url.includes('fonts.google')||e.request.url.includes('cdnjs')) return;
  e.respondWith(caches.match(e.request).then(cached=>cached||fetch(e.request).then(res=>{if(res.ok&&res.type==='basic'){const clone=res.clone();caches.open(CACHE_NAME).then(c=>c.put(e.request,clone));}return res;}).catch(()=>cached||new Response('Offline — Connect to internet',{headers:{'Content-Type':'text/plain'}}))));
});
`;
  try {
    const blob = new Blob([SW], { type:'text/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  } catch {}
}

  const mLink = document.createElement('link');
