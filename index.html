<style>
/* ═══════════════════════════════════════════════════════
   NEURAL HEALTH ID v4.1 — PRODUCTION CSS
   www.health-id.in
   ═══════════════════════════════════════════════════════ */
:root {
  --void:#00000a; --bg:#030a1a; --surface:rgba(4,14,40,.93);
  --glass:rgba(5,18,52,.80); --border:rgba(0,229,255,.13);
  --cyan:#00e5ff; --neon:#00ff9d; --plasma:#c471ff;
  --amber:#ffb700; --red:#ff2d55; --text:#d0eeff; --muted:#3a6080;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:var(--void); }
body { font-family:'Rajdhani',sans-serif; color:var(--text); overscroll-behavior:none; }

/* ANIMATIONS */
@keyframes breathe  { 0%,100%{opacity:.45;transform:scale(1)} 50%{opacity:.88;transform:scale(1.1)} }
@keyframes pulse    { 0%,100%{opacity:.65;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }
@keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes orbitR   { from{transform:rotateZ(0deg) rotateX(70deg)} to{transform:rotateZ(360deg) rotateX(70deg)} }
@keyframes slideUp  { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes glitch   { 0%,91%,100%{transform:none;opacity:1} 92%{transform:skewX(5deg);opacity:.8} 94%{transform:skewX(-3deg)} 96%{transform:none} }

/* LAYOUT */
#bg-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; }
#holo-bg   { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.hg-grid { position:absolute; inset:0; background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px); background-size:44px 44px; mask-image:radial-gradient(ellipse 85% 85% at 50% 40%,black 10%,transparent 75%); }
#shell { position:relative; z-index:10; height:100vh; display:flex; flex-direction:column; max-width:460px; margin:0 auto; }
#content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 15px 110px; }

/* NAVBAR */
#navbar { padding:7px 0 calc(var(--sab) + 6px); background:rgba(2,6,20,.97); backdrop-filter:blur(30px); border-top:1px solid var(--border); display:grid; grid-template-columns: repeat(6, 1fr); flex-shrink:0; }
.nb { display:flex; flex-direction:column; align-items:center; gap:2px; background:transparent; border:none; color:var(--muted); cursor:pointer; }
.nb.on { color:var(--cyan); border-top:2px solid var(--cyan); background:rgba(0,229,255,.07); }

/* GLASS CARD */
.card { background:var(--glass); border:1px solid var(--border); border-radius:18px; padding:17px 19px; position:relative; margin-bottom:13px; animation:slideUp .38s ease both; }
.card.glow { border-color:var(--ac,var(--cyan)); box-shadow:0 0 30px rgba(0,229,255,.12); }

/* BUTTONS */
.btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 20px; border-radius:12px; border:none; font-family:'Orbitron',monospace; font-weight:700; font-size:11px; cursor:pointer; transition:all .2s; width:100%; }
.btn-primary { background:linear-gradient(135deg,var(--cyan),var(--neon)); color:#000a14; }

/* TOAST */
#toast { position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-90px); background:var(--glass); border:1px solid var(--neon); border-radius:12px; padding:11px 18px; font-family:'Share Tech Mono',monospace; color:var(--neon); z-index:2000; transition:transform .35s; }
#toast.visible { transform:translateX(-50%) translateY(0); }
</style>
</head>
